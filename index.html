body {

}

.menubar {

}

.topnav {
    display: flex;
    justify-content: space-between;

    padding: 0 10px;
}


.topnav a {
    color: #f2f2f2;
    text-align: center;

.topnav a:hover {
    background-color: #ddd;

}

.topnav a.active {

.topnav-right {
    display: flex;
    align-items: center;
}


main {
    padding: 20px;
    text-align: center;
}

#all-games {
    padding-top: 0;
}

.game-grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 20px;
    justify-content: center;
}

.game-tile {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
    background-color: #fff;
    border-radius: 10px;
}
.game-tile-popular{
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
    background-color: #fff;
    border-radius: 10px;
     box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

.game-icon {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 5px;
}

.game-title {
    margin-top: 10px;
    font-size: 16px;
}
.nav-container{
    display: flex;
    justify-content: center;
}

.search-container {
    position: relative;
    display: inline-block;
    margin-top: 20px;
}

.search-box {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 300px;
    font-size: 16px;
}

.search-results {
    display: none;
    position: absolute;
    background-color: #fff;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 300px;
    top: 40px;
    left: 0;
    z-index: 1;
}

.search-results a {
    display: block;
    padding: 10px;
    text-decoration: none;
    color: #333;
    text-align: left;
}

.search-results a:hover {
    background-color: #f0f0f0;
}
.sortbar {
    background-color: #333;
    overflow: hidden;
    margin-top: 20px;
    border-radius: 5px;
}
.sortbar a{
     color: #f2f2f2;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
    font-size: 17px;
}
.sortbar a:hover {
    background-color: #ddd;
    color: black;
}
.sortbar a.active {
    background-color: #04AA6D;
    color: white;
}
@media screen and (max-width: 600px) {
    .topnav, .topnav-right {

        text-align: center;
        width: 100%;

        width: 100%;
    }
}

<script>
function searching(input) {
    let val = input.value.toLowerCase();
    let results = document.getElementById("search-results");
    results.innerHTML = '';
    if(val===''){
        results.style.display = "none";
    }
    else{
        results.style.display = "block";
    }

    games.forEach(game => {
        if (game.name.toLowerCase().includes(val)) {
            let a = document.createElement("a");
            a.href = game.link;
            a.textContent = game.name;
            results.appendChild(a);
        }
    });
}
function fun(input){
     let results = document.getElementById("search-results");
    results.innerHTML = '';
    if(input.value===''){
        results.style.display = "none";
    }
    else{
        results.style.display = "block";
    }
}


document.getElementById("hide").addEventListener("click", function() {
  var element = document.getElementById("search-box");
  if (element.style.display === "none") {
    element.style.display = "block";
  } else {
    element.style.display = "none";
  }
});

function startTime() {
  const today = new Date();
  let h = today.getHours();
  let m = today.getMinutes();
  let s = today.getSeconds();
  m = checkTime(m);
  s = checkTime(s);
  document.getElementById('txt').innerHTML =  h + ":" + m + ":" + s;
  setTimeout(startTime, 1000);
}

function checkTime(i) {
  if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
  return i;
}

window.onload = function() {
    const gameContainer = document.getElementById('game-container');
    games.forEach(game => {
        const gameElement = document.createElement('a');
        gameElement.href = game.link;
        gameElement.className = 'game-link';

        const tile = document.createElement('div');
        tile.className = 'game-tile';

        const img = document.createElement('img');
        img.className = 'game-icon';
        img.src = game.image;
        img.alt = 'icon';

        const title = document.createElement('h1');
        title.className = 'game-title';
        title.textContent = game.name;

        tile.appendChild(img);
        tile.appendChild(title);
        gameElement.appendChild(tile);
        gameContainer.appendChild(gameElement);
    });
};
</script>
