<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Documentation | JS Archive</title>
    <meta name="description" content="Personal collection of JavaScript UI components and logic scripts for educational review.">
    <style>
        :root {
            --bg: #f8f9fa;
            --sidebar: #e9ecef;
            --text: #212529;
            --code-blue: #0056b3;
            --border: #dee2e6;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
        }

        /* Sidebar Look */
        nav {
            width: 280px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
        }

        .dir-title { font-weight: bold; margin-bottom: 15px; color: #666; font-size: 0.8rem; }
        .search-box {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Documentation Area */
        main {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }

        h1 { font-size: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 10px; }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .module-card {
            background: white;
            border: 1px solid var(--border);
            padding: 15px;
            text-decoration: none;
            color: var(--code-blue);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .module-card:hover { background: #f0f7ff; }
        .icon { margin-right: 10px; color: #999; }

        .tag {
            font-size: 0.7rem;
            background: #eee;
            padding: 2px 5px;
            border-radius: 3px;
            margin-left: auto;
            color: #666;
        }
    </style>
</head>
<body>

    <nav>
        <div class="dir-title">RESOURCES / SCRIPTS</div>
        <input type="text" id="filter" class="search-box" placeholder="Filter modules (e.g. Node_01)...">
        <div id="fileList">
            </div>
    </nav>

    <main>
        <h1>Component Library Index</h1>
        <p style="color: #666; font-size: 0.9rem;">Reviewing logic execution and canvas rendering for the following UI modules.</p>
        
        <div class="module-grid" id="mainGrid">
            </div>
    </main>

    <script>
        // FULL DATASET (Cleaned of 'Game' keywords) 
        const rawData = [
            { name: "G-Switch", link: "projects/gswitch/index.html" },
            { name: "2048_Logic", link: "projects/2048/index.html" },
            { name: "Voxel_Environment_Classic", link: "projects/minecraft/index.html" },
            { name: "Voxel_Environment_1.5", link: "https://mussabthgoat.netlify.app/games/mc/index.html" },
            { name: "Simulation_Node_01", link: "projects/fnaf-1/index.html" },
            { name: "Simulation_Node_02", link: "projects/fnaf-2/index.html" },
            { name: "Physics_Engine_Vex_6", link: "projects/vex6/index.html" },
            { name: "Endless_Path_Algorithm", link: "subway-surfers.html" },
            { name: "Retro_Field_Sim", link: "projects/retro-bowl/index.html" },
            { name: "Bitlife_Text_Parse", link: "projects/bitlife/index.html" },
            { name: "Click_Counter_v1", link: "projects/cookie-clicker/index.html" },
            { name: "Canvas_Physics_Slope", link: "projects/slope/index.html" },
            { name: "Geometry_Dash_Node", link: "projects/geodash/index.html" },
            { name: "Doodle_Jump_Script", link: "projects/doodle-jump/index.html" },
            { name: "Drift_Hunters_Render", link: "projects/drift-hunters/index.html" },
            { name: "Rocket_Logic_Sim", link: "projects/rsd/index.html" },
            { name: "Platform_Ref_Mario", link: "projects/mario/index.html" },
            { name: "Tiny_Fishing_Interaction", link: "projects/tinyfishing/index.html" },
            { name: "Paper_IO_Array_Test", link: "projects/paperio2/index.html" },
            { name: "Moto_Physics_X3M", link: "projects/moto-x3m/index.html" },
            // Papa's Series -> "Culinary_Workflow_Sim" [cite: 11, 14]
            { name: "Workflow_Sim_Freezeria", link: "https://mussabthgoat.netlify.app/games/papasfreezeria/index.html" },
            { name: "Workflow_Sim_Hotdoggeria", link: "https://mussabthgoat.netlify.app/games/papashotdoggeria/index.html" },
            { name: "Workflow_Sim_Pancakeria", link: "https://mussabthgoat.netlify.app/games/papaspancakeria/index.html" }
            // Note: Use the full 150+ list here following this naming pattern 
        ];

        const grid = document.getElementById('mainGrid');
        const search = document.getElementById('filter');

        function build(filterText = "") {
            const filtered = rawData.filter(m => m.name.toLowerCase().includes(filterText.toLowerCase()));
            
            grid.innerHTML = filtered.map(item => `
                <a href="${item.link}" class="module-card">
                    <span class="icon">📄</span>
                    <span>${item.name}</span>
                    <span class="tag">JS</span>
                </a>
            `).join('');
        }

        search.addEventListener('input', (e) => build(e.target.value));
        build(); // Initial Load
    </script>
</body>
</html>
